worker_processes auto;
worker_rlimit_nofile 8192;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 4096;   # pool de conexiones por worker (relevante en -c 1000 o más)
}

http {
    # IMPORTANTE: se rutea al NOMBRE DEL SERVICIO de Compose ("api"), nunca a localhost.
    # Dentro de Docker, localhost es el propio contenedor de NGINX.
    # El DNS de Docker devuelve las 3 IP de las réplicas y NGINX reparte round-robin.
    upstream api_backend {
        # Health check pasivo: tras 3 fallos seguidos la réplica se marca caída 10 s.
        server api:3000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    # Registra qué réplica respondió cada pedido (evidencia del balanceo)
    log_format upstream_log '$remote_addr [$time_local] "$request" $status '
                            'upstream=$upstream_addr rt=$request_time urt=$upstream_response_time';
    access_log /var/log/nginx/access.log upstream_log buffer=32k flush=1s;

    server {
        listen 80;

        location / {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # Ante error o timeout de una réplica se reintenta en otra (solo GET; un POST no se reintenta)
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_connect_timeout 2s;
            proxy_read_timeout 2s;     # = timeout duro del gateway en el TP2 (responde 504)

            add_header X-Upstream-Addr $upstream_addr always;
        }

        # Métricas del propio balanceador (conexiones activas): diagnóstico de saturación
        location = /nginx-status {
            stub_status;
            access_log off;
        }
    }
}
