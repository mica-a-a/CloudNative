# TP3 - Arquitectura de Sistemas 2026 - GlobalLogistics S.A.
# Levanta exactamente: 1 balanceador (nginx) + 3 réplicas idénticas de la API.
# Uso:  docker-compose up -d     (construye la imagen automáticamente la primera vez)

services:
  api:
    build: ./api
    image: mi-api:latest
    # Sin container_name ni puertos publicados: así Compose puede crear 3 réplicas sin conflictos.
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "0.50"      # tope por réplica: hace reproducible la saturación en cualquier PC
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 3s
    networks:
      - backend

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - backend

networks:
  backend:
    driver: bridge
